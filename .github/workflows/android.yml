name: Android build and device tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned native toolchain
        run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        id: native
        with:
          path: build-android/jni-package
          key: android-native-r27c-${{ hashFiles('scripts/build-android.sh', 'scripts/fetch-7zip.sh', 'CMakeLists.txt', 'core/**', 'apps/android/app/src/main/cpp/**', 'third_party/lz4/**') }}
      - name: Build ARM64 and x86_64 native engines with 16 KiB support
        if: steps.native.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: sh scripts/build-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and APK
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native engine, storage and mobile UI on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            cd apps/android && ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Collect screenshots and device logs
        if: always()
        run: |
          mkdir -p android-artifacts
          adb pull /sdcard/Android/data/app.localarchiver/files/screenshots android-artifacts/ || true
          adb logcat -d > android-artifacts/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milkzip-android-api-${{ matrix.api }}
          path: |
            apps/android/app/build/outputs/apk/
            apps/android/app/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            android-artifacts/
            build-android/jni-package/
          retention-days: 30
