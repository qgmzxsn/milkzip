name: Windows offline build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.8.3-msvc2022-base-v1
      - name: Install build-only Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --archives qtbase -O "$env:RUNNER_TEMP/Qt"
      - name: Fetch pinned 7-Zip source
        shell: bash
        run: sh scripts/fetch-7zip.sh
      - name: Build 7-Zip engine
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd third_party\7zip\src\CPP\7zip\Bundles\Format7zF
          nmake /nologo PLATFORM=x64
      - name: Build application and tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEVENZIP_SRC="%CD%/third_party/7zip/src" -DCMAKE_PREFIX_PATH="%RUNNER_TEMP%/Qt/6.8.3/msvc2022_64" -DARCHIVER_TEST_ENGINE="%CD%/third_party/7zip/src/CPP/7zip/Bundles/Format7zF/x64/7z.dll" -DARCHIVER_TEST_7Z="C:/Program Files/7-Zip/7z.exe"
          if errorlevel 1 exit /b 1
          cmake --build build -j 4
      - name: Run core, GUI and Windows Credential Manager tests
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin;$env:PATH"
          $env:ARCHIVER_UI_PREVIEW_DIR = "$env:GITHUB_WORKSPACE/previews"
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package self-contained offline portable app
        shell: pwsh
        run: |
          $qt = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
          $stage = "$env:GITHUB_WORKSPACE/dist/milkzip-0.6.0-windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build/milkzip.exe,build/archiver.dll $stage
          Copy-Item third_party/7zip/src/CPP/7zip/Bundles/Format7zF/x64/7z.dll $stage
          & "$qt/bin/windeployqt.exe" --release --no-compiler-runtime --no-translations --no-opengl-sw --skip-plugin-types generic,networkinformation,tls "$stage/milkzip.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $crt = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT' -Directory | Sort-Object FullName | Select-Object -Last 1
          if (!$crt) { throw 'MSVC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" $stage
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.md $stage
          Copy-Item LICENSES "$stage/LICENSES" -Recurse
          Copy-Item packaging/windows/README-zh-CN.txt "$stage/README.txt"
          "[Paths]`nPrefix=.`nPlugins=.`n" | Set-Content "$stage/qt.conf"
          # Check the deployed app without using the SDK or build directory in PATH.
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Copy-Item build/archiver-cli.exe $stage
          $smoke = "$stage/smoke.zip"
          & $python -c "import zipfile; z=zipfile.ZipFile(r'$smoke','w'); z.writestr('smoke.txt','offline'); z.close()"
          & "$stage/archiver-cli.exe" list $smoke
          if ($LASTEXITCODE -ne 0) { throw 'Staged engine smoke test failed' }
          $process = Start-Process "$stage/milkzip.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Staged GUI exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          Remove-Item "$stage/archiver-cli.exe",$smoke
          Compress-Archive -Path $stage -DestinationPath dist/milkzip-0.6.0-windows-x64-portable.zip
          Get-ChildItem dist/*.zip | ForEach-Object {
            $checksum = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$checksum  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milkzip-0.6.0-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            previews/*.png
            build/Testing/Temporary/LastTest.log
